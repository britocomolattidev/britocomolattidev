name: Métricas do perfil

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 06:00 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", ".github/scripts/**"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar tabela de números do README
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          LC_ALL: C.UTF-8
        run: bash .github/scripts/update-metrics.sh

      - name: Gerar painel de métricas (SVG)
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: britocomolattidev
          template: classic
          # sem "activity" e "repositories": essas seções listam nomes de repositórios privados
          base: header, community, metadata
          config_timezone: America/Sao_Paulo
          config_display: large
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # habits e achievements estão quebrados na API atual do GitHub (push events sem commits e fim do
          # Projects classic); languages, lines e followup dependem da seção "repositories", que fica de fora.
          # Esses números (horários, linhas, linguagens) vêm do script e aparecem na tabela do README.
          repositories_affiliations: owner, organization_member, collaborator

      - name: Publicar alterações
        run: |
          cp /metrics_renders/metrics.svg metrics.svg 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics.svg
          git diff --cached --quiet || git commit -m "chore: atualiza métricas do perfil"
          git push
